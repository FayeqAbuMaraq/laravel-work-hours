<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4f46e5">
    <title>لا يوجد اتصال</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f1f5f9; font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; color: #1e293b; text-align: center; padding: 1rem; }
        .card { background: #fff; border-radius: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.06); padding: 2rem; max-width: 22rem; border: 1px solid #f1f5f9; }
        h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
        p { color: #64748b; line-height: 1.8; margin: 0 0 1.25rem; }
        button { background: #4f46e5; color: #fff; border: 0; border-radius: .75rem; padding: .7rem 1.5rem; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>تحتاج الحاسبة إلى الاتصال بالإنترنت لعرض بياناتك وتسجيل الحضور. تأكد من اتصالك وحاول مرة أخرى.</p>
        <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
</body>
</html>
